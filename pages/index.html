<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="index.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI/UX Comment Section Design </title>
</head>
<body>
    
    <div class="container">
        <div class="head"><h1>Post a Comment</h1></div>
        <div><span id="comment">0</span> COMMENTS NOW</div>
        <div class="text"><p> blorg </p></div>
        <div class="comments"></div>
        <div class="commentbox">
            <img src="user1.png" alt="">
            <div class="content">
                <h2>Comment as: </h2>
                <input type="text" value="Anonymous" class="user">

                <div class="commentinput">
                    <input type="text" placeholder="Enter comment" class="usercomment">
                    <div class="buttons">
                        <button type="submit" disabled id="publish">Publish</button>
                        <div class="notify">
                            <input type="checkbox" class="notifyinput"> <span>Notify me</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
const userComment = document.querySelector(".usercomment");
const publishBtn = document.querySelector("#publish");
const commentsContainer = document.querySelector(".comments");
const userName = document.querySelector(".user");
const commentCounter = document.querySelector("#comment");

userComment.addEventListener("input", () => {
    const hasComment = userComment.value.trim() !== "";

    publishBtn.disabled = !hasComment;
    publishBtn.classList.toggle("abled", hasComment);
});

function displayComment(comment) {
    const parent = document.createElement("div");
    parent.className = "parents";

    const profileImage = document.createElement("img");
    profileImage.src =
        comment.name.toLowerCase() === "anonymous"
            ? "anonymous.png"
            : "user.png";
    profileImage.alt = "";

    const content = document.createElement("div");

    const name = document.createElement("h1");
    name.textContent = comment.name;

    const message = document.createElement("p");
    message.textContent = comment.message;

    const engagements = document.createElement("div");
    engagements.className = "engagements";

    const likeImage = document.createElement("img");
    likeImage.src = "like.png";
    likeImage.alt = "Like";

    const shareImage = document.createElement("img");
    shareImage.src = "share.png";
    shareImage.alt = "Share";

    engagements.append(likeImage, shareImage);

    const date = document.createElement("span");
    date.className = "date";
    date.textContent = new Date(comment.created_at).toLocaleString();

    content.append(name, message, engagements, date);
    parent.append(profileImage, content);
    commentsContainer.append(parent);
}

function updateCommentCount() {
    commentCounter.textContent =
        commentsContainer.querySelectorAll(".parents").length;
}

async function loadComments() {
    try {
        const response = await fetch("/api/comments");

        if (!response.ok) {
            throw new Error("Could not load comments.");
        }

        const comments = await response.json();

        commentsContainer.replaceChildren();

        comments.forEach(displayComment);
        updateCommentCount();
    } catch (error) {
        console.error(error);
    }
}

async function addPost() {
    const message = userComment.value.trim();
    const name = userName.value.trim() || "Anonymous";

    if (!message) return;

    publishBtn.disabled = true;

    try {
        const response = await fetch("/api/comments", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                message: message
            })
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Could not publish comment.");
        }

        displayComment(result);
        updateCommentCount();

        userComment.value = "";
        publishBtn.classList.remove("abled");
    } catch (error) {
        alert(error.message);
    } finally {
        publishBtn.disabled = userComment.value.trim() === "";
    }
}

publishBtn.addEventListener("click", addPost);

loadComments();
</script>

</body>
</html>
